<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page may only talk to EVE's API, EVE's login, zKillboard (kill history), GitHub's API (the optional sync file) and its own address (to notice a new version), and only run its own scripts (sw.js, its own too, keeps the copy that opens with no network). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://images.evetech.net; connect-src 'self' https://esi.evetech.net https://login.eveonline.com https://zkillboard.com https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b171d">
<meta name="color-scheme" content="dark">
<!-- Bump this number and the ?v= values below together on every deploy, so browsers fetch the new files. -->
<meta name="eveops-version" content="34">
<title>Eve Ops</title>
<!-- The tab icon: the Android app's launcher icon (icons/favicon.svg), with a PNG for browsers that do not take SVG and for iOS home screens. -->
<link rel="icon" href="icons/favicon.svg?v=34" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png?v=34" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=34">
<link rel="stylesheet" href="css/app.css?v=34">
</head>
<body>
<div id="app"><noscript>Eve Ops needs JavaScript to read your orders from EVE.</noscript></div>
<script src="js/config.js?v=34"></script>
<script src="js/logic.js?v=34"></script>
<script src="js/esi.js?v=34"></script>
<script src="js/demo.js?v=34"></script>
<script src="js/whdata.js?v=34"></script>
<script src="js/wh.js?v=34"></script>
<script src="js/sync.js?v=34"></script>
<script src="js/expedition.js?v=34"></script>
<script src="js/app.js?v=34"></script>
</body>
</html>
